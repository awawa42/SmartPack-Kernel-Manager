name: Android CI

on: [push, workflow_dispatch]


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set App Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=SPKM" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Run Tests Build
      #- name: Run gradle tests
      #  run: ./gradlew test

      # Run Build Project
      - name: Build gradle project
        run: ./gradlew build

      # Create APK Release
      - name: Build apk release project (APK) - ${{ env.main_project_module }} module
        run: ./gradlew assemble

      - name: upload to tg
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_KEY: ${{ secrets.TG_BOT_TOKEN }}
        run: |
              set -x
              for apkfile in app/build/outputs/apk/**/*.apk;do
              curl -X POST "https://api.telegram.org/bot${API_KEY}/sendDocument" \
              -F "parse_mode=MarkdownV2" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${apkfile}" \
              -F "caption=from [CI ${GITHUB_RUN_ID}](https://github.com/awawa42/SmartPack-Kernel-Manager/actions/runs/${GITHUB_RUN_ID}/)" > /dev/null ||true
              done
      # Upload Artifact Build
      - name: Upload APK Release - ${{ env.repository_name }}
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ env.repository_name }} - ${{ env.date_today }} - APK release generated
          path: app/build/outputs/apk/fdroid/release/
